[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/templates"
  to = "/.netlify/functions/templates"
  status = 200

[[redirects]]
  from = "/api/watchlist"
  to = "/.netlify/functions/watchlist"
  status = 200

[[redirects]]
  from = "/api/quote"
  to = "/.netlify/functions/quote"
  status = 200

[[redirects]]
  from = "/api/discover"
  to = "/.netlify/functions/discover"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
